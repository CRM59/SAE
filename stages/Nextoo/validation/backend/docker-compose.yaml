#A mettre à la racine du projet où se situe les fichiers backend et frontend
version: "3.9"
services:
  movies_app:
    container_name: movies_app
    build: ./backend
    depends_on:
      - movies_db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://movies_db:5432/postgres
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - backend
      - frontend

  movies_web:
    container_name: movies_web
    build: ./frontend
    depends_on:
      - movies_app
    ports:
      - "5173:8080"
    networks:
      - frontend


  movies_db:
    container_name: movies_db
    image: movie-bdd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - backend


volumes:
  data:
  sonarqube_data:
  sonarqube_extensions:


networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge